<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoulSync🎧</title>
  <link rel="stylesheet" href="style.css" />
  <!-- AI Library loaded first -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  
  <!-- 2. Your Logic (Loads second) -->
  <script defer src="script.js"></script>

</head>
<body>
  <header>
    <h1>SoulSync🎧</h1>
    <button id="toggleMode" title="Toggle Dark/Light Mode">🌙</button>
  </header>

  <main>
    <!-- AI Webcam Section -->
    <div class="ai-container" style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center;">
      <video id="video" width="320" height="240" autoplay muted style="border-radius: 15px; border: 3px solid #0078ff;"></video>
      <p id="ai-status" style="margin-top: 10px; font-weight: bold; color: #555;">Loading AI Models...</p>
    </div>

    <section class="mood-section">
      <h2>How are you feeling today?</h2>
      <select id="moodSelect">
        <option value="">Select a mood</option>
        <option value="happy">😊 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="chill">😌 Chill</option>
        <option value="energetic">⚡ Energetic</option>
        <option value="romantic">❤️ Romantic</option>
      </select>
      <button id="getSong">Get Song</button>
    </section>

    <section id="result" class="hidden">
      <h3 id="songTitle"></h3>
      <p id="moodQuote"></p>
      <div id="playerContainer"></div>
      <div class="actions">
        <button id="copyBtn">📋 Copy Link</button>
        <button id="shareMood">💌 Share Song</button>
      </div>
    </section>
  </main>

  <div id="emojiContainer"></div>

  <footer>
    <p>© 2026 Farhan Khan</p>
  </footer>
</body>
</html>
